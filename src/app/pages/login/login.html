<div class="auth-shell">
  <div class="auth-side">
    <div class="sun"></div>
    <div class="brand"><div class="mark"></div>SARA Tourism</div>
    <div class="hero-image">
      <img src="/Picture3.png" alt="Sunrise safari game drive in Kruger National Park" />
    </div>
    <blockquote>
      "Book in minutes, hike by sunrise."
      <div class="quote-by">&mdash; SARA Tourism</div>
    </blockquote>
  </div>

  <div class="auth-form-side">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to manage your bookings.</p>

      @if (serverError()) {
        <div class="server-error">{{ serverError() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label>Email</label>
          <input formControlName="email" type="email" 
                 [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched" />
        </div>
        <div class="field">
          <label>Password</label>
          <input formControlName="password" type="password"
                 [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched" />
        </div>
        <button type="submit" [disabled]="submitting()">
          {{ submitting() ? 'Logging in...' : 'Log in' }}
        </button>
      </form>

      <div class="auth-foot">New to SARA Tourism? <a routerLink="/register">Create an account</a></div>
      <div class="auth-foot" style="margin-top:6px;"><a routerLink="/admin-login" style="color:var(--muted);">Admin log in</a></div>
    </div>
  </div>
</div>
